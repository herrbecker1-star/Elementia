<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elementia</title>
<!-- Wer nur die Adresse eintippt, landet hier. Die App selbst liegt in
     App/sammlung.html – dort, wo sie auch auf der Festplatte liegt, damit
     es keine zweite Fassung für das Web gibt. Das Manifest nennt als
     Startpunkt deshalb direkt sammlung.html; diese Seite ist nur der
     Wegweiser für die von Hand eingetippte Adresse.

     Seit 03.09.2026 ist sie mehr als das: Auf den Stationskärtchen steht
     der QR-Code als Adresse dieser Seite mit angehängtem "#code=…", damit
     ihn auch die normale Kamera-App eines Handys öffnen kann. Deshalb
     MUSS die Weiterleitung den Teil hinter der Raute mitnehmen – und
     genau das kann eine <meta http-equiv="refresh"> nicht: Der Browser
     wirft das Fragment weg, das Kärtchen führt zur leeren Sammlung.
     Also drei Zeilen Skript, und die Meta-Zeile bleibt als Rückfall in
     <noscript> stehen. Diese Datei steht im GERUEST von sw.js, der Weg
     funktioniert damit auch ohne Netz. -->
<link rel="canonical" href="App/sammlung.html">
<script>
  // replace() statt href: Sonst liegt der Wegweiser im Verlauf und der
  // Zurück-Knopf schickt den Schüler im Kreis.
  location.replace("App/sammlung.html" + location.search + location.hash);
</script>
<noscript><meta http-equiv="refresh" content="0; url=App/sammlung.html"></noscript>
<style>
  body {
    background: #14120f; color: #ece5d8; margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    display: grid; place-items: center; min-height: 100vh; text-align: center;
  }
  a { color: #d8cfa8; }
</style>
</head>
<body>
  <p>⚗ <a href="App/sammlung.html">Elementia · Sammlung</a></p>
</body>
</html>
